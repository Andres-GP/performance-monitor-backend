# .github/workflows/cd.yml
name: CD

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock flake8

      - name: Run critical lint checks
        run: flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run full test suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'onboarding@resend.dev' }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL || 'https://healthy-honeybee-66.clerk.accounts.dev/.well-known/jwks.json' }}
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER || 'https://healthy-honeybee-66.clerk.accounts.dev' }}
        run: pytest --cov=app --cov-report=xml --cov-report=term

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render (using API)
        id: deploy
        run: |
          # Determinar service ID según la rama
          if [ "${{ github.ref_name }}" == "main" ]; then
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_PROD }}"
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_STAGING }}"
          else
            echo "Branch not for deployment"
            exit 1
          fi

          # Llamar a la API de Render para triggerear el deploy
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          # Extraer la URL de la nueva deploy
          DEPLOY_URL=$(echo "$RESPONSE" | jq -r '.deploy.url')
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deploy triggered: $DEPLOY_URL"

      - name: Wait for deployment to complete (optional)
        run: |
          # Esperar 60 segundos para que Render termine el deploy
          sleep 60
          echo "Deployment likely completed"

      - name: Health check
        run: |
          # Obtener la URL del servicio según la rama
          if [ "${{ github.ref_name }}" == "main" ]; then
            URL="https://performance-monitor-backend-prod.onrender.com/health"
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            URL="https://performance-monitor-backend-staging.onrender.com/health"
          else
            exit 0
          fi

          for i in {1..10}; do
            if curl -f -s -o /dev/null "$URL"; then
              echo "✅ Service health endpoint is healthy"
              break
            fi
            echo "Waiting for service to be ready... ($i/10)"
            sleep 5
          done
          if ! curl -f -s -o /dev/null "$URL"; then
            echo "❌ Service not ready after 50 seconds"
            exit 1
          fi

          SCHEMA_URL="${URL%/health}/openapi.json"
          if ! curl -fsS "$SCHEMA_URL" | jq -e '.paths | has("/portfolios") and has("/monitor/events")' >/dev/null; then
            echo "❌ Monitoring API contract is missing /portfolios or /monitor/events"
            exit 1
          fi
          echo "✅ Monitoring API routes are present"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment to ${{ github.ref_name }} completed with status: ${{ job.status }}"
